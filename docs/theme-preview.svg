<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Draco UI Lib theme preview</title>
  <desc id="desc">Illustrative preview of Draco UI Lib's Mono, Light, Ocean, and Crimson themes.</desc>
  <style>
    text { font-family: Arial, sans-serif; }
    .title { font-size: 18px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 700; }
    .muted { font-size: 11px; }
  </style>
  <rect width="960" height="520" rx="18" fill="#101116"/>
  <text x="40" y="42" fill="#f5f5f7" class="title">Draco UI Lib · Theme palette preview</text>
  <text x="40" y="64" fill="#96969e" class="muted">Illustrative design board; run examples/theme_showcase.luau for the live Roblox preview.</text>

